    <main class="main-content">
        <header class="top-header">
            <h1>Tarefas e Submissões</h1>
        </header>

        <section class="card">
            <h2>Envio de Trabalho: LMS Fictício HTML5/CSS3</h2>
            <p><strong>Prazo:</strong> 15 de Outubro às 23:59</p>
            <p><strong>Status:</strong> <span class="badge badge-warning">Pendente de Envio</span></p>
            
            <form action="#" method="post" style="margin-top: 20px;">
                <div class="form-group">
                    <label for="arquivo">Selecione o arquivo do projeto (.zip):</label>
                    <input type="file" id="arquivo" name="arquivo" required>
                </div>
                <div class="form-group">
                    <label for="comentarios">Comentários do Aluno:</label>
                    <textarea id="comentarios" rows="4" placeholder="Observações sobre o trabalho..."></textarea>
                </div>
                <button type="submit">Enviar Tarefa</button>
            </form>
        </section>
    </main>
